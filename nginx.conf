server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This container sits behind a TLS-terminating proxy and only ever sees plain
    # HTTP, so an absolute redirect would downgrade the scheme to http://. Keep
    # redirects relative so the browser resolves them against the original scheme.
    absolute_redirect off;

    location = /privacy.html {
        return 301 /privacy;
    }

    # The tool briefly shipped at /sandbox before settling on /calculator; keep this so
    # any link already shared with that old path still resolves.
    location = /sandbox {
        return 301 /calculator;
    }

    # Same-origin proxy for the /calculator and /examples pages (src/sandbox-app,
    # src/examples-app), so their fetch('/api/...') calls reach the API without
    # needing CORS from this origin.
    location /api/ {
        proxy_pass https://api.pocketnutrition.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pocketnutrition.org;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
